<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-badge mx-auto mb-2">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h1 class="h4 fw-bold mb-1">Crear Cuenta GIFMint</h1>
      <p class="text-muted small mb-0">Crea tu cuenta de coleccionista</p>
    </div>

    @if (mensajeError()) {
      <div class="alert alert-danger py-2 px-3 small mb-3">{{ mensajeError() }}</div>
    }
    @if (mensajeExito()) {
      <div class="alert alert-success py-2 px-3 small mb-3">{{ mensajeExito() }}</div>
    }

    <form (ngSubmit)="registrar()">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Nombre de Coleccionista</label>
        <input
          type="text"
          name="nombre"
          class="form-control"
          [(ngModel)]="nombre"
          placeholder="Ej. Julian Zapata"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Correo electrónico</label>
        <input
          type="email"
          name="email"
          class="form-control"
          [(ngModel)]="email"
          placeholder="tu@correo.com"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Contraseña (mínimo 6 caracteres)</label>
        <input
          type="password"
          name="clave"
          class="form-control"
          [(ngModel)]="clave"
          placeholder="••••••••"
          minlength="6"
          required
        />
      </div>

      <button type="submit" class="btn-mint-primary w-100" [disabled]="enviando()">
        @if (enviando()) {
          <span class="spinner-border spinner-border-sm"></span>
          <span>Registrando...</span>
        } @else {
          <span>Registrarme</span>
        }
      </button>
    </form>

    <div class="text-center mt-3 small text-muted">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-primary fw-semibold">Inicia sesión</a>
    </div>
  </div>
</div>
