<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-badge mx-auto mb-2">
        <i class="bi bi-box-seam-fill"></i>
      </div>
      <h1 class="h4 fw-bold mb-1">Bienvenido a GIFMint Market</h1>
      <p class="text-muted small mb-0">Inicia sesión para continuar</p>
    </div>

    @if (mensajeError()) {
      <div class="alert alert-danger py-2 px-3 small mb-3">{{ mensajeError() }}</div>
    }

    <form (ngSubmit)="entrar()">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Correo electrónico</label>
        <input
          type="email"
          name="email"
          class="form-control"
          [(ngModel)]="email"
          placeholder="tu@correo.com"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Contraseña</label>
        <input
          type="password"
          name="clave"
          class="form-control"
          [(ngModel)]="clave"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" class="btn-mint-primary w-100" [disabled]="enviando()">
        @if (enviando()) {
          <span class="spinner-border spinner-border-sm"></span>
          <span>Ingresando...</span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>
    </form>

    <div class="text-center mt-3 small text-muted">
      ¿No tienes cuenta?
      <a routerLink="/registro" class="text-primary fw-semibold">Crear cuenta</a>
    </div>
    <div class="text-center mt-2">
      <a routerLink="/" class="small text-muted">← Volver a explorar sin cuenta</a>
    </div>
  </div>
</div>
